name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[build]

      - name: Verify tag matches package metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash scripts/release.sh --check "${GITHUB_REF_NAME}"

      - name: Build EXE
        run: python scripts/build_standalone.py

      - name: Generate SHA-256 checksum
        run: python scripts/build_standalone.py --checksum dist/SimpleStipple.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleStipple-windows
          path: |
            dist/SimpleStipple.exe
            dist/SimpleStipple.exe.sha256

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SimpleStipple.exe
            dist/SimpleStipple.exe.sha256

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[build]

      - name: Verify tag matches package metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/release.sh --check "${GITHUB_REF_NAME}"

      - name: Build macOS app bundle
        run: python scripts/build_standalone.py

      - name: Package DMG
        run: |
          hdiutil create -volname "SimpleStipple" \
            -srcfolder "dist/SimpleStipple.app" \
            -ov -format UDZO "dist/SimpleStipple-macOS.dmg"

      - name: Generate SHA-256 checksum
        run: python scripts/build_standalone.py --checksum dist/SimpleStipple-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleStipple-macos
          path: |
            dist/SimpleStipple-macOS.dmg
            dist/SimpleStipple-macOS.dmg.sha256

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SimpleStipple-macOS.dmg
            dist/SimpleStipple-macOS.dmg.sha256
