name: Build Desktop Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[build]

      - name: Verify tag matches package metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash scripts/release.sh --check "${GITHUB_REF_NAME}"

      - name: Build EXE
        run: python scripts/build_standalone.py

      - name: Generate SHA-256 checksum
        run: python scripts/build_standalone.py --checksum dist/SimpleStipple.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleStipple-windows
          path: |
            dist/SimpleStipple.exe
            dist/SimpleStipple.exe.sha256

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SimpleStipple.exe
            dist/SimpleStipple.exe.sha256

  build-macos:
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[build]

      - name: Verify tag matches package metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/release.sh --check "${GITHUB_REF_NAME}"

      - name: Build macOS app bundle
        run: python scripts/build_standalone.py

      - name: Require macOS release signing credentials
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.MACOS_CERTIFICATE_BASE64 == '' }}
        run: |
          echo "MACOS_CERTIFICATE_BASE64 is required for a distributable release."
          exit 1

      # Gatekeeper requires a Developer ID signature and notarization for a
      # downloadable app. Keep these credentials in repository secrets; fail
      # the release job rather than quietly publishing an unsigned DMG.
      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERTIFICATE_BASE64 != '' }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "MACOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign macOS app
        if: ${{ env.MACOS_SIGNING_IDENTITY != '' }}
        run: |
          codesign --deep --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" dist/SimpleStipple.app
          codesign --verify --deep --strict --verbose=2 dist/SimpleStipple.app

      - name: Package DMG
        run: |
          hdiutil create -volname "SimpleStipple" \
            -srcfolder "dist/SimpleStipple.app" \
            -ov -format UDZO "dist/SimpleStipple-macOS.dmg"

      - name: Notarize and staple macOS DMG
        if: ${{ env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        run: |
          xcrun notarytool submit dist/SimpleStipple-macOS.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple dist/SimpleStipple.app
          hdiutil detach "$(hdiutil attach -nobrowse -readonly dist/SimpleStipple-macOS.dmg | awk '/Volumes\/SimpleStipple/ {print $1; exit}')" || true
          xcrun stapler staple dist/SimpleStipple-macOS.dmg
          spctl --assess --type open --context context:primary-signature dist/SimpleStipple.app

      - name: Require macOS notarization credentials
        if: ${{ startsWith(github.ref, 'refs/tags/') && (env.APPLE_ID == '' || env.APPLE_APP_PASSWORD == '' || env.APPLE_TEAM_ID == '') }}
        run: |
          echo "APPLE_ID, APPLE_APP_PASSWORD, and APPLE_TEAM_ID are required for a distributable release."
          exit 1

      - name: Generate SHA-256 checksum
        run: python scripts/build_standalone.py --checksum dist/SimpleStipple-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleStipple-macos
          path: |
            dist/SimpleStipple-macOS.dmg
            dist/SimpleStipple-macOS.dmg.sha256

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SimpleStipple-macOS.dmg
            dist/SimpleStipple-macOS.dmg.sha256
