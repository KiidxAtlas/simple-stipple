name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install libegl1
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libegl1
        timeout-minutes: 5
      - run: uv run ruff check .
      - name: Circular import check
        run: uv run python scripts/check_circular_imports.py
      - run: uv run python -m compileall -q src tests
      - run: uv run python -c "import simple_stipple.app; import simple_stipple.app.launcher"
      - run: uv run pytest -q --tb=short
      - name: Type-check refactored boundaries
        run: uv run mypy src
      - run: uv run pyright
