[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-stipple"
version = "0.3.11"
description = "Desktop app for drafting, tracing, and generating pattern fills for laser and vector workflows."
keywords = ["laser engraving", "vector graphics", "DXF", "SVG", "stipple", "maker tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "ezdxf>=1.4.3",
    "shapely>=2.1.2",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "numba>=0.64",
    "pyclipper>=1.4.0",
    "pydantic>=2.0",
    "svgelements>=1.9.6",
]

[project.urls]
Homepage = "https://github.com/KiidxAtlas/simple-stipple"
Repository = "https://github.com/KiidxAtlas/simple-stipple"
Issues = "https://github.com/KiidxAtlas/simple-stipple/issues"
Releases = "https://github.com/KiidxAtlas/simple-stipple/releases"
Support = "https://buymeacoffee.com/KiidxAtlas"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
    "mypy>=1.16",
    "pyright>=1.1.403",
    "pytest-qt>=4.5",
    "hypothesis>=6.135",
    "pytest-benchmark>=5.1",
]
build = [
    "pyinstaller>=6.0",
]
telemetry = [
    "sentry-sdk>=2.0",
]
cad = [
    "python-solvespace>=3.0.8",
]
dist = [
    "pyarmor>=8.7",       # Bytecode obfuscation for PyInstaller bundles
    "pyinstaller>=6.0",
]

[project.scripts]
simple-stipple = "simple_stipple.app.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901"]
ignore = ["E501", "B007", "B905"]

[tool.ruff.lint.mccabe]
# Fifteen is the target ceiling for new and changed code. The files below hold
# pre-existing functions above it and remain scoped exceptions; remove a file
# once every function in it is back under the limit.
# a file from this list once every function in it is back under 15.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/simple_stipple/core/document/service.py" = ["C901"]
"src/simple_stipple/core/cad/constraints.py" = ["C901"]
"src/simple_stipple/core/cad/preflight.py" = ["C901"]
"src/simple_stipple/core/cad/snapping.py" = ["C901"]
"src/simple_stipple/core/formats/dxf.py" = ["C901"]
"src/simple_stipple/core/formats/service.py" = ["C901"]
"src/simple_stipple/core/formats/svg.py" = ["C901"]
"src/simple_stipple/core/document/model.py" = ["C901"]
"src/simple_stipple/core/patterns/geometry.py" = ["C901"]
"src/simple_stipple/core/patterns/fill.py" = ["C901"]
"src/simple_stipple/core/patterns/processing.py" = ["C901"]
"src/simple_stipple/canvas/widget.py" = ["C901"]
"src/simple_stipple/canvas/renderer.py" = ["C901"]
"src/simple_stipple/canvas/operations/editing.py" = ["C901"]
"src/simple_stipple/canvas/snap.py" = ["C901"]
"src/simple_stipple/canvas/tools/tools.py" = ["C901"]
"src/simple_stipple/canvas/tools/selection.py" = ["C901"]
"src/simple_stipple/canvas/view/commands.py" = ["C901"]
"src/simple_stipple/canvas/view/interactions.py" = ["C901"]
"src/simple_stipple/canvas/view/main.py" = ["C901"]
"src/simple_stipple/features/pattern/page.py" = ["C901"]
"src/simple_stipple/canvas/widgets/properties_panel.py" = ["C901"]
"src/simple_stipple/ui/dialogs/settings_dialog.py" = ["C901"]
"src/simple_stipple/canvas/layers/widget.py" = ["C901"]
"scripts/validate_codebase.py" = ["C901"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
# Third-party type coverage varies across supported Python/PySide/ezdxf
# versions, so compatibility ignores may be unused in one matrix leg and
# required in another.
warn_unused_ignores = false
exclude = ["src/simple_stipple.egg-info"]

# These Qt canvas classes are composed from cooperative mixins at runtime.
# Mypy checks each mixin in isolation and therefore cannot see attributes
# supplied by the final QWidget subclass. Only disable the composition-
# specific diagnostics — keep flow, type-arg, and return-type checks.
[[tool.mypy.overrides]]
module = [
    "simple_stipple.canvas.tools.dimension_tool",
    "simple_stipple.canvas.tools.dimension_backend",
    "simple_stipple.canvas.tools.dragging",
    "simple_stipple.canvas.tools.selection",
    "simple_stipple.canvas.tools.tools",
    "simple_stipple.canvas.view.config",
    "simple_stipple.canvas.view.main",
    "simple_stipple.canvas.widget",
]
disable_error_code = [
    "abstract",
    "attr-defined",
    "assignment",
    "has-type",
    "method-assign",
    "misc",
    "no-redef",
    "override",
    "union-attr",
    "var-annotated",
]

[[tool.mypy.overrides]]
module = ["simple_stipple.core.cad.shapes"]
disable_error_code = ["has-type", "misc"]

[[tool.mypy.overrides]]
module = [
    "simple_stipple.features.convert.page",
    "simple_stipple.features.draft.page",
    "simple_stipple.features.pattern.page",
    "simple_stipple.features.trace.page",
]
disable_error_code = ["abstract", "attr-defined"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simple_stipple = [
    "resources/tiles/*.dxf",
    "ui/style/*.qss",
    "ui/style/icons/*.svg",
]
