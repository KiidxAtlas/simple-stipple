[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-stipple"
version = "0.3.3"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "ezdxf>=1.4.3",
    "shapely>=2.1.2",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
    "mypy>=1.16",
    "pytest-qt>=4.5",
    "hypothesis>=6.135",
    "pytest-benchmark>=5.1",
]
build = [
    "pyinstaller>=6.0",
]
cad = [
    "python-solvespace>=3.0.8",
]

[project.scripts]
simple-stipple = "src.infra.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B007", "B905"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
# Third-party type coverage varies across supported Python/PySide/ezdxf
# versions, so compatibility ignores may be unused in one matrix leg and
# required in another.
warn_unused_ignores = false
exclude = ["src/simple_stipple.egg-info"]

# These Qt canvas classes are composed from cooperative mixins at runtime.
# Mypy checks each mixin in isolation and therefore cannot see attributes
# supplied by the final QWidget subclass. Keep all value/flow checks enabled,
# while disabling only the composition-specific diagnostics for this package.
[[tool.mypy.overrides]]
module = [
    "src.ui.canvas.view",
    "src.ui.canvas.dxf_canvas",
    "src.ui.canvas.mixins.*",
]
disable_error_code = [
    "abstract",
    "arg-type",
    "assignment",
    "attr-defined",
    "call-overload",
    "has-type",
    "index",
    "misc",
    "no-redef",
    "operator",
    "override",
    "union-attr",
]

[[tool.mypy.overrides]]
module = [
    "src.ui.pages.convert",
    "src.ui.pages.draft",
    "src.ui.pages.pattern.tab",
    "src.ui.pages.trace.tab",
]
disable_error_code = ["abstract", "assignment", "attr-defined", "has-type"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
