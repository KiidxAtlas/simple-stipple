[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-stipple"
version = "0.3.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "ezdxf>=1.4.3",
    "shapely>=2.1.2",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.12",
    "mypy>=1.16",
    "pytest-qt>=4.5",
    "hypothesis>=6.135",
    "pytest-benchmark>=5.1",
]
build = [
    "pyinstaller>=6.0",
]
cad = [
    "python-solvespace>=3.0.8",
]

[project.scripts]
simple-stipple = "src.infra.launcher:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B007", "B905"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["src/simple_stipple.egg-info"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
