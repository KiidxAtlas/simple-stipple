[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-stipple"
version = "0.1.2"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "ezdxf>=1.4.3",
    "shapely>=2.1.2",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]
build = [
    "pyinstaller>=6.0",
]
cad = [
    "python-solvespace>=3.0.8",
]

[project.scripts]
simple-stipple = "src.launcher:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
